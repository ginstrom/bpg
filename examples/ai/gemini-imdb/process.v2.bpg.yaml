schema_version: 2
process:
  name: gemini_imdb_enrichment
  trigger: ingest
  nodes:
    ingest:
      ref:
        package: bpg.nodes.core@v1
        node: passthrough
    read_csv:
      ref:
        package: bpg.nodes.core@v1
        node: csv.read
      config:
        path: examples/ai/gemini-imdb/imdb_first10.csv
        row_id_field: row_id
        review_column: review
        sentiment_column: sentiment
        output_review_field: review
        output_sentiment_field: source_sentiment
    enrich:
      ref:
        package: bpg.nodes.ai@v1
        node: google
      config:
        model: gemini-2.5-flash-lite
        api_key_env: GOOGLE_API_KEY
        temperature: 0
        max_tokens: 1500
        system_prompt: |
          You are enriching IMDB review rows.
          Return strict JSON only with this shape:
          {"items": [{"row_id": int, "source_sentiment": string,
            "predicted_sentiment": "positive|negative|neutral",
            "category": "plot|acting|direction|pacing|writing|overall",
            "summary": string}]}
  edges:
    - from: ingest
      to: read_csv
    - from: read_csv
      to: enrich
