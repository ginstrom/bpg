schema_version: 2
process:
  name: parse-sum
  trigger: ingest
  nodes:
    ingest:
      ref:
        package: bpg.nodes.core@v1
        node: passthrough
    parse:
      ref:
        package: bpg.nodes.core@v1
        node: text.parse_numbers
    sum:
      ref:
        package: bpg.nodes.core@v1
        node: math.sum_numbers
  edges:
    - from: ingest
      to: parse
    - from: parse
      to: sum
