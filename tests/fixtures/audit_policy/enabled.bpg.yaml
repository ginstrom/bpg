metadata:
  name: audit-policy-enabled
  version: 1.0.0

types:
  In:
    text: string
  Out:
    ok: bool

node_types:
  worker@v1:
    in: In
    out: Out
    provider: mock
    version: v1
    config_schema: {}

nodes:
  start:
    type: worker@v1
    config: {}

trigger: start
edges: []

observability:
  audit:
    enabled: true
    sink: postgres
    dsn_env: BPG_AUDIT_DATABASE_URL
    failure_policy: warn
    retention: regulated
    payload_retention: redacted
    redaction_policy_id: default
    redacted_field_paths:
      - text
    tags:
      environment: test
      data_classification: confidential
