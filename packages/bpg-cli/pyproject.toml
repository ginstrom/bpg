[project]
name = "bpg-cli"
version = "0.1.0"
description = "Framework-first CLI for BPG — node discovery, validation, compilation, and worker management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bpg-sdk",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.scripts]
bpg = "bpg_cli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
